name: Deploy site to Cloudflare Pages

# Builds docs/ (data files minified -- see scripts/prepare-site.js) and uploads
# it to a Cloudflare Pages project that sits behind Cloudflare Access (login).
#
# MANUAL ONLY FOR NOW: this is the test run against a throwaway project while the
# private-site move is prepared. At cutover it gets called after each data sync
# and the GitHub Pages site is turned off. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (permission: Account > Cloudflare Pages > Edit)
#   CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Cloudflare Pages project name"
        required: true
        default: "tr-access-test"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site folder (minify data files)
        run: node scripts/prepare-site.js dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project }}
        run: npx --yes wrangler@3.99.0 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
