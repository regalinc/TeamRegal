name: Sync sheets and commissions

# Cloud replacement for the Windows-only refresh-hvac-sales / refresh-manual-
# metrics / refresh-commission-report tasks: reads the two workbooks from
# SharePoint (Microsoft Graph), rebuilds hvac-sales.json and manual-metrics.json,
# then recomputes commission-report.json from the OnCall Air sold-proposal data.
#
# SHEETS_MODE controls what it does with the results:
#   compare  (shadow) -- parse everything, diff against the committed files,
#                        change and commit NOTHING.
#   write    (live)   -- overwrite the data files, stamp refresh-health.json,
#                        commit and push.
# Flip it below (one line) once compare has matched for a while, and retire the
# Windows scheduled tasks at the same time (two writers = formatting churn).
# Does nothing (and doesn't fail) until the MS_* secrets exist.

on:
  schedule:
    # Off the :00/:30 congestion peaks, like the other bots.
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Open a TEST duplicate-sale issue, to check that the email alert reaches you"
        type: boolean
        default: false

env:
  SHEETS_MODE: compare

permissions:
  contents: write
  issues: write

concurrency:
  group: sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A healthy run takes well under a minute; never let a stuck one sit for hours.
    timeout-minutes: 10
    env:
      # Pay weeks are Wed-Tue in Eastern time, and the commission script buckets
      # sales by local calendar day -- the runner defaults to UTC.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out OnCall Air sold-proposal data
        uses: actions/checkout@v4
        with:
          repository: regalinc/oncallair-sales-data
          token: ${{ secrets.ONCALLAIR_READ_TOKEN }}
          path: oncallair-sales-data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read the workbooks
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: node scripts/sync-sheets.js --${{ env.SHEETS_MODE }} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Recompute commissions
        shell: pwsh
        run: |
          $out = if ($env:SHEETS_MODE -eq 'write') { './docs/data/commission-report.json' } else { Join-Path $env:RUNNER_TEMP 'commission-report.json' }
          ./scripts/update-commission-scorecard.ps1 `
            -SoldProposalsDir ./oncallair-sales-data/sold-proposals `
            -HvacSalesJson ./docs/data/hvac-sales.json `
            -OutJson $out

      - name: Compare commissions to the committed report (shadow)
        if: env.SHEETS_MODE == 'compare'
        shell: bash
        run: node scripts/compare-json.js docs/data/commission-report.json "$RUNNER_TEMP/commission-report.json" meta.generated_at 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stamp health and commit (live)
        if: env.SHEETS_MODE == 'write'
        shell: bash
        run: |
          node scripts/stamp-health.js hvacSales commission manualMetrics
          git config user.name "sheets-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/hvac-sales.json docs/data/manual-metrics.json docs/data/commission-report.json docs/data/refresh-health.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -q -m "Sync sheets and commissions [skip ci]"
          # Other bots (HCP, Bouncie) and people push to main too: rebase onto
          # whatever landed meanwhile, and retry a few times on a race.
          for attempt in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 4 attempts"
          exit 1

      # --- Double-counted sale alert ----------------------------------------
      # find-duplicate-proposals.ps1 flags OnCall Air sales that may be counted
      # twice (e.g. a wrong option accepted, then replaced). Each new flag opens
      # ONE GitHub issue assigned to regalinc -- GitHub emails the assignee --
      # and the issue closes itself once the flag is gone (resolved, or
      # confirmed as two real sales in commission-overrides.ps1). Issue text has
      # no dollar amounts: this repo is public. Runs in both compare and write
      # mode, and a failure here never blocks the data commit above.
      - name: Check for possible duplicate sales
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/find-duplicate-proposals.ps1 `
            -SoldProposalsDir ./oncallair-sales-data/sold-proposals `
            -OutJson (Join-Path $env:RUNNER_TEMP 'dupes.json')

      - name: Open or close duplicate-sale issues
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/dupes.json"
          if [ "${TEST_ALERT:-false}" = "true" ]; then
            jq '.flags = ((.flags // []) | if type=="array" then . else [.] end) + [{"title":"Possible duplicate sale: TEST (only a test)","body":"This is only a test of the duplicate-sale alert -- nothing is wrong. It closes itself on the next hourly run."}]' "$json" > "$json.tmp"
            mv "$json.tmp" "$json"
          fi
          flags=$(jq -c '(.flags // []) | if type=="array" then . else [.] end' "$json")
          gh label create duplicate-sale --color D93F0B --description "OnCall Air sale that may be double-counted" 2>/dev/null || true
          open=$(gh issue list --label duplicate-sale --state open --json number,title)

          # Open an issue for each current flag that doesn't have one yet.
          jq -c '.[]' <<<"$flags" | while read -r flag; do
            title=$(jq -r '.title' <<<"$flag")
            body=$(jq -r '.body' <<<"$flag")
            if ! jq -e --arg t "$title" 'map(select(.title == $t)) | length > 0' <<<"$open" >/dev/null; then
              gh issue create --title "$title" --label duplicate-sale --assignee regalinc --body "@regalinc $body"
            fi
          done

          # Close issues whose flag has gone away.
          current=$(jq -r '.[].title' <<<"$flags")
          jq -c '.[]' <<<"$open" | while read -r issue; do
            num=$(jq -r '.number' <<<"$issue")
            title=$(jq -r '.title' <<<"$issue")
            if ! grep -Fxq -- "$title" <<<"$current"; then
              gh issue close "$num" --comment "No longer flagged -- resolved, or confirmed as two separate sales."
            fi
          done
