name: Sync Housecall Pro data

on:
  schedule:
    # Hourly, at :17 rather than :00. GitHub's own docs warn that `:00` (and
    # `:30`) are the most congested minutes for the schedule trigger, since
    # that's when everyone else's cron jobs also fire — confirmed here too:
    # actual runs were landing 2.5-11 hours apart on "0 * * * *" despite the
    # hourly setting. An off-the-hour minute avoids that congestion peak;
    # it won't guarantee exact hourly delivery (schedule stays best-effort),
    # but should land far closer to it than :00 did.
    #
    # Since 2026-11-11 (repo is private, Actions minutes are metered): hourly
    # only in business hours (11:00-01:59 UTC = 6/7 am - 8/9 pm Eastern), every
    # 3 hours overnight. Keep the sync-bouncie / sync-sheets / deploy-cloudflare
    # schedules on the same hours.
    - cron: "17 11-23,0 * * *"
    - cron: "17 3,6,9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hcp-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (fetch-depth: 1) clone.
          # `git commit --amend` on a shallow checkout doesn't see the real
          # parent commit and silently produces an orphaned (parentless)
          # commit — force-pushing that discards the entire branch history.
          # Learned this the hard way; keep this full-depth fetch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync
        env:
          HCP_API_KEY: ${{ secrets.HCP_API_KEY }}
        run: node scripts/sync.js

      # The sync above takes ~20 minutes; if anything else pushed to main in
      # that time (the Bouncie bot, the local refresh scripts, a human), a plain
      # push was rejected and the whole run's data was thrown away -- ~13 of
      # every 100 runs failed this way (found 2026-11-02). The script re-bases
      # this run's data files onto the newest main and retries the push. It
      # also keeps the amend-vs-fresh-commit convention (see the script).
      - name: Commit updated data
        run: bash scripts/commit-hcp-data.sh
